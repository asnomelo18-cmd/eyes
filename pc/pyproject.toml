[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyes_pc"
version = "0.1.0"
description = "Eyes — application Windows (étape 1)"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "qasync>=0.27",
    "aiortc>=1.10",
    "websockets>=13",
    "zeroconf>=0.136",
    "sounddevice>=0.5",
    "cryptography>=43",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-qt>=4.4"]

[project.scripts]
eyes-pc = "eyes_pc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
